<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лабораторна робота 4: Адаптивна галерея</title>
  <style>
    /* Базові налаштування */
    body {
        background-color: #eef0fa;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    header, footer {
        text-align: center;
        padding: 20px;
    }

    header h1, footer p {
        margin: 0;
        color: #333;
    }

    /* Налаштування основного контейнера */
    main {
        flex: 1;
        display: flex;
        justify-content: center;
        padding: 40px 20px;
    }

    /* Flexbox сітка */
    .gallery-container {
        display: flex;
        flex-wrap: wrap; 
        justify-content: center;
        gap: 60px 80px; /* Відступи між рядками та колонками */
        max-width: 1000px;
        width: 100%;
    }

    /* Налаштування картки */
    .gallery-item {
        background-color: #ffffff;
        border: 1px solid #555555;
        padding: 15px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 220px; /* Фіксована ширина картки для ідентичності з вашим зразком */
    }

    /* Налаштування картинок */
    .gallery-item img {
        width: 100%;
        height: auto;
        object-fit: cover;
        margin-bottom: 15px;
    }

    /* Налаштування тексту */
    .text-overlay {
        text-align: center;
    }

    .text-overlay p {
        font-size: 12px;
        color: #000000;
        margin: 0;
        line-height: 1.4;
    }
  </style>
</head>
<body>
  <header>
    <h1>Адаптивний дизайн з Flexbox</h1>
  </header>
  
  <main>
    <div class="gallery-container">
      <div class="gallery-item">
        <img src="1.jpg" alt="Природа">
        <div class="text-overlay">
          <p>Захід сонця над гірським озером.</p>
        </div>
      </div>
      
      <div class="gallery-item">
        <img src="2.jpg" alt="Місто">
        <div class="text-overlay">
          <p>Неоновими вогні над хмарочосами.</p>
        </div>
      </div>
      
      <div class="gallery-item">
        <img src="3.png" alt="Авто">
        <div class="text-overlay">
          <p>Aвтомобіль на гоночному треку.</p>
        </div>
      </div>
      
      <div class="gallery-item">
        <img src="4.jpg" alt="Сніданок">
        <div class="text-overlay">
          <p>Апетитний сніданок.</p>
        </div>
      </div>
      
      <div class="gallery-item">
        <img src="5.WEBP" alt="Мейкун">
        <div class="text-overlay">
          <p>Kошеня</p>
        </div>
      </div>
      
      <div class="gallery-item">
        <img src="6.jpg" alt="Космос">
        <div class="text-overlay">
          <p>Планети та зіроки.</p>
        </div>
      </div>
      
      <div class="gallery-item">
        <img src="7.jpg" alt="Футбол">
        <div class="text-overlay">
          <p> Футбольний матч </p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>Дякую за увагу!</p>
  </footer>
</body>
</html>
